run:
  timeout: 5m
  go: '1.26.2'
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - whitespace

linters-settings:
  govet:
    enable-all: false # Keep it conservative
  errcheck:
    check-type-assertions: false # Conservative: don't require all type assertions checked
    check-blank: false # Conservative: allow blank error assignments

issues:
  exclude-rules:
    - path: _test.go
      linters:
        - errcheck

  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 3
