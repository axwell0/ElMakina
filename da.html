<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMAKINA — المكينة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF3E8;
            --paper: #FFF8F0;
            --orange: #F4A261;
            --orange-dark: #E76F51;
            --green: #2A9D8F;
            --green-glow: #2DC653;
            --dark: #264653;
            --red: #E63946;
            --gold: #FFB703;
            --black: #1A1A1A;
            --scanline: rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--cream);
            font-family: 'Cairo', sans-serif;
            color: var(--black);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        .game-header {
            background: var(--paper);
            border-bottom: 4px solid var(--black);
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .logo .arabic {
            font-family: 'Cairo', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--orange-dark);
        }

        .gear-icon {
            width: 32px;
            height: 32px;
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .turn-indicator {
            background: var(--black);
            color: var(--green-glow);
            padding: 8px 20px;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            border: 2px solid var(--green);
            box-shadow: 0 0 10px rgba(45, 198, 83, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(45, 198, 83, 0.3); }
            50% { box-shadow: 0 0 20px rgba(45, 198, 83, 0.6); }
        }

        /* --- MAIN GAME AREA --- */
        .game-stage {
            flex: 1;
            display: flex;
            padding: 24px;
            gap: 24px;
            position: relative;
        }

        /* --- PLAYER MONITORS --- */
        .players-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            width: 60%;
            height: 100%;
        }

        .player-monitor {
            background: var(--paper);
            border: 4px solid var(--black);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 6px 6px 0 var(--black);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .player-monitor.active {
            border-color: var(--orange);
            box-shadow: 6px 6px 0 var(--orange-dark);
            transform: translate(-2px, -2px);
        }

        .player-monitor.eliminated {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .monitor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: 900;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--green-glow);
            border: 2px solid var(--black);
            box-shadow: 0 0 6px var(--green-glow);
        }

        .status-light.off {
            background: var(--red);
            box-shadow: 0 0 6px var(--red);
        }

        .coin-counter {
            background: var(--gold);
            border: 3px solid var(--black);
            border-radius: 20px;
            padding: 4px 14px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 2px 2px 0 var(--black);
        }

        .coin-icon {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #FFD60A, var(--gold));
            border: 2px solid var(--black);
            border-radius: 50%;
        }

        /* TV SCREEN */
        .tv-screen {
            flex: 1;
            background: var(--dark);
            border: 4px solid var(--black);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    var(--scanline) 2px,
                    var(--scanline) 4px
            );
            pointer-events: none;
            z-index: 5;
        }

        .screen-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(42, 157, 143, 0.2), transparent 70%);
            pointer-events: none;
            z-index: 4;
        }

        .screen-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: var(--green-glow);
            font-family: 'Space Mono', monospace;
        }

        .screen-content.hidden-role {
            font-size: 0.9rem;
            letter-spacing: 2px;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            52% { opacity: 0.3; }
            54% { opacity: 1; }
        }

        .static-noise {
            position: absolute;
            inset: 0;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: noise 0.2s steps(3) infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes noise {
            0% { transform: translate(0,0); }
            33% { transform: translate(-5px, 5px); }
            66% { transform: translate(5px, -5px); }
            100% { transform: translate(0,0); }
        }

        .character-svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(3px 3px 0 var(--black));
        }

        .role-label {
            margin-top: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--green);
            color: var(--black);
            padding: 2px 10px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 700;
            border: 2px solid var(--black);
        }

        .cards-indicator {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .influence-card {
            width: 36px;
            height: 48px;
            background: var(--orange);
            border: 3px solid var(--black);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 2px 2px 0 var(--black);
            transition: all 0.3s;
        }

        .influence-card.lost {
            background: var(--red);
            opacity: 0.4;
            transform: rotate(15deg);
        }

        /* --- CENTRAL MACHINE HUB --- */
        .machine-hub {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .machine-body {
            width: 100%;
            max-width: 400px;
            background: var(--orange);
            border: 5px solid var(--black);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            box-shadow: 8px 8px 0 var(--black);
        }

        .machine-body::before,
        .machine-body::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--cream);
            border: 4px solid var(--black);
            border-radius: 50%;
            top: -20px;
        }

        .machine-body::before { left: 30px; }
        .machine-body::after { right: 30px; }

        .machine-screen {
            background: var(--dark);
            border: 4px solid var(--black);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .machine-screen .scanlines,
        .machine-screen .static-noise {
            opacity: 0.1;
        }

        .machine-text {
            font-family: 'Space Mono', monospace;
            color: var(--green-glow);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            z-index: 3;
            position: relative;
        }

        .loading-bar {
            width: 80%;
            height: 20px;
            background: var(--black);
            border: 3px solid var(--black);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            z-index: 3;
        }

        .loading-fill {
            height: 100%;
            background: repeating-linear-gradient(
                    90deg,
                    var(--green-glow),
                    var(--green-glow) 10px,
                    var(--green) 10px,
                    var(--green) 20px
            );
            width: 0%;
            transition: width 0.3s;
            animation: loadingStripe 1s linear infinite;
        }

        @keyframes loadingStripe {
            from { background-position: 0 0; }
            to { background-position: 20px 0; }
        }

        .machine-knobs {
            display: flex;
            justify-content: space-around;
            margin-top: 16px;
        }

        .knob {
            width: 36px;
            height: 36px;
            background: var(--gold);
            border: 3px solid var(--black);
            border-radius: 50%;
            position: relative;
            box-shadow: 2px 2px 0 var(--black);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .knob::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 12px;
            background: var(--black);
            border-radius: 2px;
        }

        .knob:active {
            transform: rotate(45deg) scale(0.95);
        }

        .knob:nth-child(1) { animation: spin 12s linear infinite; }
        .knob:nth-child(2) { animation: spin 8s linear infinite reverse; }
        .knob:nth-child(3) { animation: spin 15s linear infinite; }

        .decorative-gears {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
        }

        .gear-big {
            width: 120px;
            height: 120px;
            position: absolute;
            top: -40px;
            right: -40px;
            animation: spin 20s linear infinite;
        }

        /* --- ACTION CONSOLE --- */
        .action-console {
            background: var(--paper);
            border-top: 4px solid var(--black);
            padding: 20px 32px;
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            box-shadow: 0 -4px 0 rgba(0,0,0,0.1);
        }

        .action-btn {
            background: var(--cream);
            border: 4px solid var(--black);
            border-radius: 10px;
            padding: 12px 24px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 4px 4px 0 var(--black);
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
        }

        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--black);
        }

        .action-btn.primary {
            background: var(--orange);
        }

        .action-btn.danger {
            background: var(--red);
            color: white;
        }

        .action-btn.success {
            background: var(--green);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 4px 4px 0 var(--black);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* --- ANIMATIONS --- */
        @keyframes coinFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            50% { transform: translate(0, -40px) scale(1.2); }
            100% { transform: translate(0, 0) scale(1); opacity: 1; }
        }

        .coin-animate {
            animation: coinFly 0.6s ease-out;
        }

        @keyframes cardBurn {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.1) rotate(5deg); filter: brightness(2) sepia(1) hue-rotate(-30deg); }
            100% { transform: scale(0) rotate(20deg); filter: brightness(3); opacity: 0; }
        }

        .card-burn {
            animation: cardBurn 0.8s ease-in forwards;
        }

        @keyframes stealArc {
            0% { transform: translate(0, 0); }
            25% { transform: translate(20px, -60px); }
            75% { transform: translate(-20px, -60px); }
            100% { transform: translate(0, 0); }
        }

        .steal-anim {
            animation: stealArc 0.8s ease-in-out;
        }

        /* --- LOG PANEL --- */
        .log-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 220px;
            background: var(--paper);
            border: 3px solid var(--black);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 4px 4px 0 var(--black);
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.2);
            color: var(--dark);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--orange-dark);
            font-size: 0.65rem;
        }

        /* --- TOOLTIP / OVERLAY --- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            background: var(--paper);
            border: 5px solid var(--black);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 10px 10px 0 var(--black);
            text-align: center;
        }

        .modal h2 {
            font-family: 'Space Mono', monospace;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .target-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }

        .target-btn {
            background: var(--cream);
            border: 3px solid var(--black);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            box-shadow: 3px 3px 0 var(--black);
            transition: all 0.1s;
        }

        .target-btn:hover {
            background: var(--orange);
            transform: translate(-1px, -1px);
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="game-header">
    <div class="logo">
        <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6m4.22-13.22l-4.24 4.24m-4.24 4.24l4.24 4.24M23 12h-6m-6 0H1m20.07 4.93l-4.24-4.24m-4.24-4.24l-4.24 4.24"/>
        </svg>
        <h1>ELMAKINA <span class="arabic">المكينة</span></h1>
    </div>
    <div class="turn-indicator" id="turnDisplay">TOUR 1 — EN ATTENTE</div>
</header>

<!-- MAIN STAGE -->
<main class="game-stage">

    <!-- PLAYERS GRID -->
    <div class="players-container" id="playersContainer">
        <!-- Generated by JS -->
    </div>

    <!-- CENTRAL MACHINE -->
    <div class="machine-hub">
        <div class="machine-body">
            <svg class="gear-big decorative-gears" viewBox="0 0 100 100">
                <path d="M50 10 L54 10 L56 20 L60 21 L65 12 L69 14 L66 24 L70 26 L78 20 L80 24 L74 32 L76 36 L86 33 L87 38 L78 42 L78 46 L90 48 L90 52 L78 54 L78 58 L87 62 L86 67 L76 64 L74 68 L80 76 L78 80 L70 74 L66 76 L69 86 L65 88 L60 79 L56 80 L54 90 L50 90 L48 80 L44 79 L39 88 L35 86 L38 76 L34 74 L26 80 L24 76 L30 68 L28 64 L18 67 L17 62 L26 58 L26 54 L14 52 L14 48 L26 46 L26 42 L17 38 L18 33 L28 36 L30 32 L24 24 L26 20 L34 26 L38 24 L35 14 L39 12 L44 21 L48 20 Z"
                      fill="var(--black)"/>
            </svg>

            <div class="machine-screen" id="machineScreen">
                <div class="scanlines"></div>
                <div class="static-noise"></div>
                <div class="screen-glow"></div>
                <div class="machine-text" id="machineText">DEMOCRACY LOADING...</div>
                <div class="loading-bar">
                    <div class="loading-fill" id="loadingFill" style="width: 35%"></div>
                </div>
            </div>

            <div class="machine-knobs">
                <div class="knob" style="transform: rotate(30deg)"></div>
                <div class="knob" style="transform: rotate(120deg)"></div>
                <div class="knob" style="transform: rotate(240deg)"></div>
            </div>
        </div>

        <!-- Game Log -->
        <div class="log-panel" id="gameLog">
            <div class="log-entry"><span class="log-time">[18:42]</span> Partie initialisée</div>
            <div class="log-entry"><span class="log-time">[18:42]</span> 4 joueurs connectés</div>
        </div>
    </div>
</main>

<!-- ACTION CONSOLE -->
<nav class="action-console" id="actionConsole">
    <button class="action-btn primary" onclick="gameAction('income')">
        <span class="btn-icon">💰</span>
        <span>Revenu (1)</span>
    </button>
    <button class="action-btn primary" onclick="gameAction('business')">
        <span class="btn-icon">🏦</span>
        <span>Business (3)</span>
    </button>
    <button class="action-btn" onclick="gameAction('thief')">
        <span class="btn-icon">🎭</span>
        <span>Voler (2)</span>
    </button>
    <button class="action-btn danger" onclick="gameAction('terrorist')">
        <span class="btn-icon">💣</span>
        <span>Eliminer</span>
    </button>
    <button class="action-btn success" onclick="gameAction('tax')">
        <span class="btn-icon">📋</span>
        <span>Taxer (3)</span>
    </button>
</nav>

<!-- TARGET MODAL -->
<div class="overlay" id="targetModal">
    <div class="modal">
        <h2 id="modalTitle">CHOISIR UNE CIBLE</h2>
        <p id="modalDesc">Sélectionnez un joueur à cibler</p>
        <div class="target-grid" id="targetGrid"></div>
        <div class="modal-buttons">
            <button class="action-btn" onclick="closeModal()">Annuler</button>
        </div>
    </div>
</div>

<script>
    // --- GAME STATE ---
    const roles = [
        { id: 'business', name: 'Business', color: '#F4A261', icon: '🏦' },
        { id: 'thief', name: 'Voleur', color: '#E76F51', icon: '🎭' },
        { id: 'terrorist', name: 'Terroriste', color: '#E63946', icon: '💣' },
        { id: 'colonel', name: 'Colonel', color: '#264653', icon: '🎖️' },
        { id: 'politician', name: 'Politicien', color: '#2A9D8F', icon: '🎤' },
        { id: 'taxman', name: 'Taxman', color: '#E9C46A', icon: '📋' },
        { id: 'police', name: 'Police', color: '#2B2D42', icon: '👮' }
    ];

    let players = [
        { id: 0, name: 'Vous', coins: 2, cards: ['business', 'thief'], revealed: [], isBot: false, active: true },
        { id: 1, name: 'Amine', coins: 2, cards: ['terrorist', 'colonel'], revealed: [], isBot: true, active: true },
        { id: 2, name: 'Sarah', coins: 2, cards: ['politician', 'taxman'], revealed: [], isBot: true, active: true },
        { id: 3, name: 'Karim', coins: 2, cards: ['police', 'business'], revealed: [], isBot: true, active: true }
    ];

    let currentPlayer = 0;
    let currentAction = null;
    let turn = 1;

    // --- SVG CHARACTERS ---
    const charSVGs = {
        business: `<svg class="character-svg" viewBox="0 0 100 100"><rect x="25" y="20" width="50" height="60" rx="10" fill="#F4A261" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="35" r="12" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="3"/><rect x="35" y="50" width="30" height="25" fill="#264653" stroke="#1A1A1A" stroke-width="3"/><rect x="30" y="30" width="15" height="4" rx="2" fill="#1A1A1A"/><rect x="55" y="30" width="15" height="4" rx="2" fill="#1A1A1A"/><path d="M45 42 Q50 45 55 42" stroke="#1A1A1A" stroke-width="2" fill="none"/><rect x="20" y="55" width="10" height="25" rx="5" fill="#F4A261" stroke="#1A1A1A" stroke-width="3"/><rect x="70" y="55" width="10" height="25" rx="5" fill="#F4A261" stroke="#1A1A1A" stroke-width="3"/></svg>`,

        thief: `<svg class="character-svg" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="30" ry="35" fill="#2B2D42" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="40" r="14" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="3"/><rect x="38" y="32" width="24" height="10" rx="3" fill="#1A1A1A"/><circle cx="44" cy="38" r="2" fill="white"/><circle cx="56" cy="38" r="2" fill="white"/><path d="M45 48 Q50 46 55 48" stroke="#1A1A1A" stroke-width="2" fill="none"/><rect x="30" y="60" width="40" height="20" rx="5" fill="#E76F51" stroke="#1A1A1A" stroke-width="3"/><circle cx="35" cy="55" r="8" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="2"/><circle cx="65" cy="55" r="8" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="2"/></svg>`,

        terrorist: `<svg class="character-svg" viewBox="0 0 100 100"><rect x="30" y="15" width="40" height="70" rx="8" fill="#E63946" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="35" r="14" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="3"/><rect x="35" y="25" width="30" height="8" rx="4" fill="#1A1A1A"/><circle cx="43" cy="36" r="3" fill="#1A1A1A"/><circle cx="57" cy="36" r="3" fill="#1A1A1A"/><path d="M42 45 L50 42 L58 45" stroke="#1A1A1A" stroke-width="2" fill="none"/><rect x="38" y="55" width="24" height="20" rx="4" fill="#1A1A1A"/><circle cx="50" cy="65" r="6" fill="#E63946" stroke="#FFE8D6" stroke-width="2"/></svg>`,

        colonel: `<svg class="character-svg" viewBox="0 0 100 100"><path d="M25 80 L30 30 L50 20 L70 30 L75 80 Z" fill="#264653" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="38" r="14" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="3"/><path d="M35 25 L50 15 L65 25 L65 30 L50 25 L35 30 Z" fill="#E9C46A" stroke="#1A1A1A" stroke-width="3"/><rect x="42" y="34" width="6" height="3" fill="#1A1A1A"/><rect x="52" y="34" width="6" height="3" fill="#1A1A1A"/><path d="M45 48 Q50 46 55 48" stroke="#1A1A1A" stroke-width="2" fill="none"/><rect x="45" y="55" width="10" height="15" fill="#E9C46A" stroke="#1A1A1A" stroke-width="2"/></svg>`,

        politician: `<svg class="character-svg" viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="28" ry="32" fill="#2A9D8F" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="38" r="15" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="3"/><path d="M35 28 Q50 22 65 28" stroke="#1A1A1A" stroke-width="3" fill="none"/><circle cx="43" cy="38" r="3" fill="#1A1A1A"/><circle cx="57" cy="38" r="3" fill="#1A1A1A"/><path d="M42 48 Q50 52 58 48" stroke="#1A1A1A" stroke-width="2" fill="none"/><rect x="38" y="58" width="24" height="4" fill="#E63946"/><rect x="35" y="68" width="30" height="15" rx="5" fill="#264653" stroke="#1A1A1A" stroke-width="3"/></svg>`,

        taxman: `<svg class="character-svg" viewBox="0 0 100 100"><rect x="28" y="25" width="44" height="55" rx="8" fill="#E9C46A" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="40" r="13" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="3"/><rect x="40" y="32" width="8" height="3" rx="1" fill="#1A1A1A"/><rect x="52" y="32" width="8" height="3" rx="1" fill="#1A1A1A"/><path d="M45 48 Q50 46 55 48" stroke="#1A1A1A" stroke-width="2" fill="none"/><rect x="20" y="60" width="18" height="22" rx="4" fill="#8B4513" stroke="#1A1A1A" stroke-width="3"/><rect x="62" y="60" width="18" height="22" rx="4" fill="#8B4513" stroke="#1A1A1A" stroke-width="3"/><text x="50" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">$</text></svg>`,

        police: `<svg class="character-svg" viewBox="0 0 100 100"><path d="M30 75 L32 35 L50 25 L68 35 L70 75 Z" fill="#2B2D42" stroke="#1A1A1A" stroke-width="3"/><circle cx="50" cy="40" r="13" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="3"/><path d="M35 28 L50 20 L65 28 L65 32 L50 28 L35 32 Z" fill="#1A1A1A"/><circle cx="44" cy="38" r="2.5" fill="#1A1A1A"/><circle cx="56" cy="38" r="2.5" fill="#1A1A1A"/><path d="M46 46 Q50 44 54 46" stroke="#1A1A1A" stroke-width="2" fill="none"/><rect x="45" y="55" width="10" height="8" fill="#E9C46A" stroke="#1A1A1A" stroke-width="2"/><rect x="20" y="50" width="12" height="25" rx="4" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="2"/><rect x="68" y="50" width="12" height="25" rx="4" fill="#FFE8D6" stroke="#1A1A1A" stroke-width="2"/></svg>`
    };

    // --- RENDER ---
    function renderPlayers() {
        const container = document.getElementById('playersContainer');
        container.innerHTML = '';

        players.forEach((player, idx) => {
            const isActive = idx === currentPlayer;
            const isEliminated = !player.active;

            const monitor = document.createElement('div');
            monitor.className = `player-monitor ${isActive ? 'active' : ''} ${isEliminated ? 'eliminated' : ''}`;
            monitor.dataset.id = player.id;

            // Header
            const header = document.createElement('div');
            header.className = 'monitor-header';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'player-name';
            const light = document.createElement('span');
            light.className = `status-light ${isEliminated ? 'off' : ''}`;
            nameDiv.appendChild(light);
            nameDiv.appendChild(document.createTextNode(player.name));

            const coins = document.createElement('div');
            coins.className = 'coin-counter';
            coins.innerHTML = `<span class="coin-icon"></span><span id="coins-${player.id}">${player.coins}</span>`;

            header.appendChild(nameDiv);
            header.appendChild(coins);

            // TV Screen
            const screen = document.createElement('div');
            screen.className = 'tv-screen';

            const scanlines = document.createElement('div');
            scanlines.className = 'scanlines';
            const noise = document.createElement('div');
            noise.className = 'static-noise';
            const glow = document.createElement('div');
            glow.className = 'screen-glow';

            const content = document.createElement('div');
            content.className = 'screen-content';

            if (player.revealed.length > 0) {
                // Show revealed role
                const role = roles.find(r => r.id === player.revealed[player.revealed.length - 1]);
                content.innerHTML = charSVGs[role.id] || charSVGs['business'];
                const label = document.createElement('div');
                label.className = 'role-label';
                label.style.background = role.color;
                label.textContent = role.name;
                content.appendChild(label);
            } else {
                // Hidden
                content.innerHTML = `<div class="screen-content hidden-role">IDENTITÉ SECRÈTE<br>●●●●●</div>`;
            }

            screen.appendChild(scanlines);
            screen.appendChild(noise);
            screen.appendChild(glow);
            screen.appendChild(content);

            // Cards indicator
            const cardsDiv = document.createElement('div');
            cardsDiv.className = 'cards-indicator';
            const aliveCards = player.cards.length - player.revealed.length;
            for (let i = 0; i < player.cards.length; i++) {
                const card = document.createElement('div');
                card.className = `influence-card ${i >= aliveCards ? 'lost' : ''}`;
                card.textContent = i >= aliveCards ? '✕' : '?';
                cardsDiv.appendChild(card);
            }

            monitor.appendChild(header);
            monitor.appendChild(screen);
            monitor.appendChild(cardsDiv);
            container.appendChild(monitor);
        });
    }

    function log(msg) {
        const panel = document.getElementById('gameLog');
        const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
        panel.insertBefore(entry, panel.firstChild);
    }

    function setMachine(text, progress = null) {
        document.getElementById('machineText').textContent = text;
        if (progress !== null) {
            document.getElementById('loadingFill').style.width = progress + '%';
        }
    }

    // --- ACTIONS ---
    function gameAction(action) {
        if (currentPlayer !== 0) return; // Only human player for demo

        currentAction = action;

        if (action === 'thief' || action === 'terrorist') {
            showTargetModal(action);
            return;
        }

        executeAction(action);
    }

    function showTargetModal(action) {
        const modal = document.getElementById('targetModal');
        const grid = document.getElementById('targetGrid');
        const title = document.getElementById('modalTitle');
        const desc = document.getElementById('modalDesc');

        title.textContent = action === 'thief' ? 'VOLER UN JOUEUR' : 'ELIMINER UNE CARTE';
        desc.textContent = action === 'thief' ? 'Choisissez qui voler (2 pièces)' : 'Choisissez une cible à éliminer';

        grid.innerHTML = '';
        players.forEach((p, idx) => {
            if (idx !== 0 && p.active) {
                const btn = document.createElement('button');
                btn.className = 'target-btn';
                btn.textContent = p.name;
                btn.onclick = () => {
                    closeModal();
                    executeAction(action, idx);
                };
                grid.appendChild(btn);
            }
        });

        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('targetModal').classList.remove('active');
        currentAction = null;
    }

    function executeAction(action, targetIdx = null) {
        const player = players[0];
        let msg = '';

        setMachine('EXÉCUTION...', 70);

        setTimeout(() => {
            switch(action) {
                case 'income':
                    player.coins += 1;
                    msg = 'Vous prenez 1 pièce (Revenu)';
                    animateCoins(0);
                    break;
                case 'business':
                    player.coins += 3;
                    msg = 'Vous prenez 3 pièces (Business)';
                    animateCoins(0);
                    break;
                case 'thief':
                    if (targetIdx !== null && players[targetIdx].coins >= 2) {
                        players[targetIdx].coins -= 2;
                        player.coins += 2;
                        msg = `Vous volez 2 pièces à ${players[targetIdx].name}`;
                        animateCoins(0);
                        animateCoins(targetIdx);
                        document.querySelector(`[data-id="${targetIdx}"] .coin-counter`).classList.add('steal-anim');
                    } else {
                        msg = 'Cible invalide ou insuffisante';
                    }
                    break;
                case 'terrorist':
                    if (targetIdx !== null) {
                        const target = players[targetIdx];
                        if (target.cards.length > target.revealed.length) {
                            const toReveal = target.cards.find(c => !target.revealed.includes(c));
                            target.revealed.push(toReveal);
                            msg = `${target.name} perd une influence! (${roles.find(r => r.id === toReveal).name})`;

                            // Card burn animation
                            const cardEl = document.querySelector(`[data-id="${targetIdx}"] .influence-card:not(.lost)`);
                            if (cardEl) cardEl.classList.add('card-burn');

                            if (target.revealed.length >= target.cards.length) {
                                target.active = false;
                                msg += ' — ÉLIMINÉ!';
                            }
                        }
                    }
                    break;
                case 'tax':
                    player.coins += 3;
                    msg = 'Vous collectez 3 pièces (Taxe)';
                    animateCoins(0);
                    break;
            }

            log(msg);
            renderPlayers();
            setMachine('ACTION COMPLÉTÉE', 100);

            setTimeout(() => {
                nextTurn();
            }, 1000);

        }, 600);
    }

    function animateCoins(playerId) {
        const el = document.getElementById(`coins-${playerId}`);
        if (el) {
            el.parentElement.classList.add('coin-animate');
            setTimeout(() => el.parentElement.classList.remove('coin-animate'), 600);
        }
    }

    function nextTurn() {
        // Simple turn rotation
        do {
            currentPlayer = (currentPlayer + 1) % players.length;
        } while (!players[currentPlayer].active && players.some(p => p.active));

        turn++;
        document.getElementById('turnDisplay').textContent = `TOUR ${turn} — ${players[currentPlayer].name}`;

        if (players[currentPlayer].isBot) {
            setMachine(`BOT: ${players[currentPlayer].name.toUpperCase()}...`, 20);
            document.getElementById('actionConsole').querySelectorAll('button').forEach(b => b.disabled = true);

            setTimeout(() => {
                botPlay();
            }, 1500);
        } else {
            setMachine('DEMOCRACY LOADING...', 35);
            document.getElementById('actionConsole').querySelectorAll('button').forEach(b => b.disabled = false);
        }

        renderPlayers();
    }

    function botPlay() {
        const bot = players[currentPlayer];
        const actions = ['income', 'business', 'tax'];
        const action = actions[Math.floor(Math.random() * actions.length)];

        let msg = '';
        switch(action) {
            case 'income':
                bot.coins += 1;
                msg = `${bot.name} prend 1 pièce`;
                break;
            case 'business':
                bot.coins += 3;
                msg = `${bot.name} prend 3 pièces (Business)`;
                break;
            case 'tax':
                bot.coins += 3;
                msg = `${bot.name} taxe 3 pièces`;
                break;
        }

        log(msg);
        renderPlayers();
        setMachine('ACTION COMPLÉTÉE', 100);

        setTimeout(() => {
            // Check if human is only one left
            const activeHumans = players.filter((p, i) => !p.isBot && p.active).length;
            const activeBots = players.filter((p, i) => p.isBot && p.active).length;

            if (activeHumans > 0 && activeBots === 0) {
                setMachine('VICTOIRE!', 100);
                log('🎉 Vous avez gagné!');
                return;
            }

            nextTurn();
        }, 1000);
    }

    // --- INIT ---
    renderPlayers();
    setMachine('DEMOCRACY LOADING...', 35);
    log('Bienvenue dans ELMAKINA');
</script>
</body>
</html>
